# Render Blueprint: kostenloser Server, Daten liegen in einer kostenlosen Upstash-Datenbank
services:
  - type: web
    name: schnittwerk
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/ping
    envVars:
      - key: Alan              # dein Spielername -> bekommt die ID #1
        sync: false
      - key: https://pretty-prawn-288825.upstash.io  # aus dem Upstash-Dashboard (REST API)
        sync: false
      - key: gQAAAAAABGg5AAIgcDI4NWYwODdmMmIwNDY0OGVmYjg1N2IzNGVmM2FjZjRiMw
        sync: false
